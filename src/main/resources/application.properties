spring.application.name=finance

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/finance_sqli_lab}
spring.datasource.username=${DB_USER:your-user}
spring.datasource.password=${DB_PASSWORD:your-pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.address=127.0.0.1

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# Application logging
logging.level.com.sekutlu.finance=DEBUG
